<style>
  :root{ --ink:#fff4ee; --ink-soft:rgba(255,240,232,.76); --pill:rgba(255,255,255,.08); --pill-hover:rgba(255,255,255,.16); --pill-border:rgba(255,200,190,.35); --focus:#ffd27a; color-scheme:dark; }
  html,body{ height:100%; margin:0; overflow:hidden; overscroll-behavior:none; }
  body{
    background:radial-gradient(140% 100% at 50% 30%, #1c0512 0%, #0e020a 55%, #060005 100%);
    background-color:#060005; color:var(--ink);
    font-family:"DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  .sky{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0; }
  /* one layer per colour theme; a firework crossfades to the next one */
  .sky i{ position:absolute; inset:0; opacity:0; transition:opacity 1.6s ease; }
  .sky i.on{ opacity:1; }
  .sky i:nth-child(1){ background:radial-gradient(110% 55% at 50% 78%, rgba(229,26,77,.2) 0%, rgba(229,26,77,0) 72%), linear-gradient(180deg, #0d0208 0%, #1f0512 55%, #47102a 100%); }
  .sky i:nth-child(2){ background:radial-gradient(110% 55% at 50% 78%, rgba(255,140,30,.16) 0%, rgba(255,140,30,0) 72%), linear-gradient(180deg, #0d0603 0%, #231106 55%, #4c260c 100%); }
  .sky i:nth-child(3){ background:radial-gradient(110% 55% at 50% 78%, rgba(20,190,190,.15) 0%, rgba(20,190,190,0) 72%), linear-gradient(180deg, #020a10 0%, #071c28 55%, #0d3a4a 100%); }
  .sky i:nth-child(4){ background:radial-gradient(110% 55% at 50% 78%, rgba(215,50,215,.17) 0%, rgba(215,50,215,0) 72%), linear-gradient(180deg, #0c0312 0%, #200a2c 55%, #40145a 100%); }
  #trail, #fx{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #trail, #fx{ z-index:0; pointer-events:none; }
  /* JS sizes this so the tower sits centred; everything inside is positioned as % of the photo */
  #city{ position:fixed; z-index:1; left:50%; bottom:0; opacity:0; transition:opacity 1.2s ease .1s; pointer-events:none; user-select:none; -webkit-user-select:none; will-change:transform; }
  #city.ready{ opacity:1; }
  #city img{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* the lit photo is revealed by a growing circle centred on the tower */
  #lit{ --r:0%; -webkit-mask-image:radial-gradient(circle at 50% 35%, #000 var(--r), transparent calc(var(--r) + 16%)); mask-image:radial-gradient(circle at 50% 35%, #000 var(--r), transparent calc(var(--r) + 16%)); }
  /* firework light falling on the rooftops: only where there are buildings */
  #tint{ position:absolute; inset:0; opacity:0; mix-blend-mode:screen; -webkit-mask:url(img/city-lit.webp) center/100% 100% no-repeat; mask:url(img/city-lit.webp) center/100% 100% no-repeat; }
  /* the logo, on the blank panel in the photo */
  #sign{ position:absolute; left:46.08%; top:21.56%; width:7.67%; height:19.04%; background:#08060c; display:grid; place-items:center; overflow:hidden; transition:box-shadow 1s ease; box-shadow:0 0 0 0 transparent; }
  #sign svg{ width:88%; height:auto; display:block; opacity:.42; filter:saturate(.75); transition:opacity .9s ease, filter .9s ease; }
  #sign.on svg{ opacity:1; filter:none; }
  #sign.on{ box-shadow:0 0 34px 3px var(--sign-glow, rgba(229,26,77,.55)); }
  .pill{
    font:inherit; font-weight:500; font-size:15px; color:var(--ink);
    background:var(--pill); border:1px solid var(--pill-border); border-radius:999px;
    cursor:pointer; touch-action:manipulation; min-height:44px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:background .25s, border-color .25s, transform .15s, opacity .4s;
  }
  .pill:hover{ background:var(--pill-hover); }
  .pill:active{ transform:scale(.97); }
  .pill:focus-visible{ outline:2px solid var(--focus); outline-offset:3px; }
  /* JS sets `top` so the button sits on the tower, under the logo */
  #start{
    --lip:#a8661a; position:fixed; z-index:3; left:50%; top:70%;
    transform:translate(-50%, -50%); min-height:56px; padding:0 30px;
    display:inline-flex; align-items:center; gap:10px; white-space:nowrap;
    font:700 17px/1 "DM Sans", ui-sans-serif, system-ui, sans-serif; letter-spacing:-.005em; color:#3b1600;
    border:0; border-radius:999px; cursor:pointer; touch-action:manipulation;
    background:linear-gradient(180deg, #ffe6a8, #f2b24a);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75), inset 0 -2px 6px rgba(0,0,0,.12), 0 5px 0 var(--lip), 0 14px 34px rgba(255,190,90,.5);
    transition:transform .09s ease, box-shadow .09s ease, opacity .5s ease, filter .2s;
  }
  #start svg{ width:19px; height:19px; flex:none; }
  #start:hover{ filter:brightness(1.05); }
  #start:active{ transform:translate(-50%, calc(-50% + 4px)); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6), 0 1px 0 var(--lip), 0 5px 14px rgba(255,190,90,.5); }
  #start:focus-visible{ outline:2px solid #fff; outline-offset:4px; }
  #start::after{ content:""; position:absolute; inset:-6px; border-radius:999px; pointer-events:none; animation:invite 2.4s ease-out infinite; }
  @keyframes invite{ 0%{ box-shadow:0 0 0 0 rgba(255,205,120,.5); } 70%,100%{ box-shadow:0 0 0 16px rgba(255,205,120,0); } }
  #start.gone{ opacity:0; pointer-events:none; }
  #hint, #again{ position:fixed; z-index:3; left:50%; transform:translateX(-50%); opacity:0; pointer-events:none; }
  #hint{ bottom:calc(env(safe-area-inset-bottom,0px) + 18px); margin:0; font-size:14px; color:var(--ink-soft); white-space:nowrap; text-shadow:0 1px 8px rgba(0,0,0,.7); transition:opacity .6s; }
  #hint.on{ opacity:1; }
  #again{ bottom:calc(env(safe-area-inset-bottom,0px) + 46px); padding:0 20px; white-space:nowrap; }
  #again.on{ opacity:1; pointer-events:auto; }
  #sound{ position:fixed; z-index:3; top:calc(env(safe-area-inset-top,0px) + 16px); right:16px; width:44px; height:44px; padding:0; display:grid; place-items:center; }
  #sound svg{ width:19px; height:19px; }
  #sound .off{ display:none; }
  #sound[aria-pressed="false"] .on{ display:none; }
  #sound[aria-pressed="false"] .off{ display:block; }
  @media (prefers-reduced-motion: reduce){ #start::after{ animation:none; } }
  :root[data-mood="marigold"]{ --sign-glow:rgba(255,160,60,.55); }
  :root[data-mood="peacock"]{ --sign-glow:rgba(40,210,205,.5); }
  :root[data-mood="rani"]{ --sign-glow:rgba(225,80,225,.55); }
</style>

</button>

      const g = spiralPoints(reduce ? 50 : 100);
      shapeBurst(x, y, g.a, span, { col:c1, w:1.8 * depth + .3, dim });
      shapeBurst(x, y, g.b, span, { col:c2, w:1.8 * depth + .3, dim });
    } else if (type === 'text'){
      const sp = Math.min(FW * .46, 470);
      textPoints(burst.text).forEach((p) => {
        spawn(x + p[0] * sp, y + p[1] * sp, (Math.random() - .5) * 6, (Math.random() - .5) * 6, { drag:2, grav:7, life:3.6 + Math.random() * .5, col:Math.random() < .3 ? '255,255,255' : '255,222,150', w:2, dim:1, force:true, wait:(p[0] + 1) * .55, still:1 });
      });
    }
    flashes.push({ x, y, age:0, life:.5, r:speed * .9, col:c1, sky:depth });
    // the burst lights the buildings too
    const fc = c1.split(',');
    cityFlash(+fc[0] / 255, +fc[1] / 255, +fc[2] / 255, depth, x);
    // in a barrage, bangs that land almost together would just clip
    if (time - lastBoom > .09){ lastBoom = time; sfx.boom(x, big, burst.cracks, r.vol, (1 - depth) * .5); }
  }

  function diamond(len, wid, back){
    fctx.beginPath();
    fctx.moveTo(len, 0); fctx.lineTo(0, wid); fctx.lineTo(-back, 0); fctx.lineTo(0, -wid);
    fctx.closePath();
  }
  function star(r){
    const k = r * .24;
    fctx.beginPath();
    fctx.moveTo(r, 0); fctx.lineTo(k, k); fctx.lineTo(0, r); fctx.lineTo(-k, k);
    fctx.lineTo(-r, 0); fctx.lineTo(-k, -k); fctx.lineTo(0, -r); fctx.lineTo(k, -k);
    fctx.closePath();
  }
  function updateFx(dt){
    for (let i = rockets.length - 1; i >= 0; i--){
      const r = rockets[i];
      r.age += dt;
      const t = Math.min(1, r.age / r.life), e = 1 - Math.pow(1 - t, 3);
      r.px = r.x; r.py = r.y;
      r.x = r.sx + (r.tx - r.sx) * e + Math.sin(r.age * 22) * 1.2;
      r.y = r.sy + (r.ty - r.sy) * e;
      if (t >= 1){ burstAt(r.tx, r.ty, r); rockets.splice(i, 1); }
    }
    for (let i = parts.length - 1; i >= 0; i--){
      const q = parts[i];
      if (q.wait > 0){ q.wait -= dt; continue; }
      q.age += dt;
      if (q.age >= q.life){
        if (q.split){
          // crossette: each shell cracks into a small cross
          const a0 = Math.atan2(q.vy, q.vx) + .78, s = 150 * unit();
          for (let k = 0; k < 4; k++){
            const a = a0 + k * 1.571;
            spawn(q.x, q.y, Math.cos(a) * s, Math.sin(a) * s, { drag:2.3, grav:80, life:.8, col:q.col, w:q.w * .75, dim:q.dim });
          }
        }
        parts.splice(i, 1); continue;
      }
      const drag = Math.exp(-q.drag * dt);
      q.px = q.x; q.py = q.y;
      q.vx *= drag; q.vy = q.vy * drag + q.grav * dt;
      q.x += q.vx * dt; q.y += q.vy * dt;
      // willow: the falling streaks shed tiny embers
      if (q.wig){ q.vx += Math.sin(time * 15 + q.ph) * q.wig * dt; q.vy += Math.cos(time * 12 + q.ph) * q.wig * .6 * dt; }
      if (q.sparks && Math.random() < q.sparks * dt * 7 && parts.length < MAX_PARTS - 100){
        spawn(q.x, q.y, (Math.random() - .5) * 18, 10 + Math.random() * 16, { drag:1.2, grav:42, life:.5 + Math.random() * .5, col:'255,170,80', w:.7, twinkle:1, dim:q.dim });
      }
    }
    for (let i = flashes.length - 1; i >= 0; i--){
      flashes[i].age += dt;
      if (flashes[i].age >= flashes[i].life) flashes.splice(i, 1);
    }
  }
  let fadeTick = 0, trailQuiet = 0;
  function drawTrails(dt){
    // Low-alpha fades stall before reaching zero, so every few frames a stronger pass clears the last of it.
    tctx.globalCompositeOperation = 'destination-out';
    fadeTick = (fadeTick + 1) % 5;
    tctx.fillStyle = 'rgba(0,0,0,' + (fadeTick ? (1 - Math.exp(-3 * dt)).toFixed(3) : '.16') + ')';
    tctx.fillRect(0, 0, FW, FH);
    if (!rockets.length && !parts.length){
      trailQuiet += dt;
      if (trailQuiet > 1.4){ tctx.clearRect(0, 0, FW, FH); trailQuiet = -1e9; }
      return;
    }
    trailQuiet = 0;
    tctx.globalCompositeOperation = 'lighter';
    for (const r of rockets){
      tctx.globalAlpha = .75 * r.depth; tctx.strokeStyle = 'rgb(255,214,160)'; tctx.lineWidth = 1.6 * r.depth + .4;
      tctx.beginPath(); tctx.moveTo(r.px, r.py); tctx.lineTo(r.x, r.y); tctx.stroke();
    }
    for (const q of parts){
      if (q.wait > 0 || q.still) continue;
      const k = q.age / q.life;
      let a = Math.pow(1 - k, 1.25) * q.dim;
      if (q.twinkle) a *= .35 + .65 * Math.abs(Math.sin(time * 19 + q.ph));
      if (a < .02) continue;
      tctx.globalAlpha = a; tctx.strokeStyle = 'rgb(' + q.col + ')'; tctx.lineWidth = q.w;
      tctx.beginPath(); tctx.moveTo(q.px, q.py); tctx.lineTo(q.x, q.y); tctx.stroke();
    }
    tctx.globalAlpha = 1;
  }
  function drawFx(t){
    fctx.globalCompositeOperation = 'lighter';
    for (const f of flashes){
      const k = f.age / f.life, a = (1 - k) * (1 - k);
      // the burst lights the whole sky for a moment, then its own core
      if (flashes.length < 5) glow(f.x, f.y, Math.max(FW, FH) * .75, f.col, a * .2 * f.sky);
      glow(f.x, f.y, f.r * (.5 + k * .7), '255,244,232', a * .75 * f.sky);
    }
    for (const r of rockets){
      fctx.globalAlpha = r.depth;
      fctx.drawImage(dot('255,225,180'), r.x - 7, r.y - 7, 14, 14);
    }
    for (const q of parts){
      if (q.wait > 0) continue;
      const k = q.age / q.life;
      let a = (k < .05 ? k / .05 : Math.pow(1 - k, q.still ? .6 : 1.3)) * q.dim;
      if (q.twinkle) a *= .3 + .7 * Math.abs(Math.sin(t * 24 + q.ph));
      if (a < .02) continue;
      const sz = 3 + q.w * 2.6;
      fctx.globalAlpha = a;
      fctx.drawImage(dot(q.col), q.x - sz / 2, q.y - sz / 2, sz, sz);
    }
    fctx.globalAlpha = 1;
    fctx.globalCompositeOperation = 'source-over';
  }

  // ---------- Searchlights: beams from the rooftops, swinging with the music ----------
  const BEAT = 60 / 107.7;
  // rooftops in the photo, in photo pixels, nearest the tower first
  const beamRoofs = [[885, 150], [1050, 150], [640, 412], [1300, 366], [485, 350], [1672, 352], [96, 322], [1872, 362]];
  const beams = beamRoofs.map((p, i) => ({ p, ph:i * 1.3, sp:.5 + (i % 3) * .17, lean:(p[0] - PHOTO_W / 2) / PHOTO_W * 1.4 }));
  let beamLevel = 0;
  function drawBeams(t){
    if (beamLevel < .02) return;
    fctx.globalCompositeOperation = 'lighter';
    const col = rgb(tone.soft), pulse = .7 + .3 * Math.pow(Math.abs(Math.cos(t * Math.PI / BEAT)), 3);
    for (const b of beams){
      const [x, y] = px2(b.p);
      const a = b.lean * .6 + Math.sin(t * b.sp + b.ph) * .5;
      const len = FH * 1.15, spread = .055;
      const ex = Math.sin(a), ey = -Math.cos(a), px = -ey * len * spread, py = ex * len * spread;
      const tx = x + ex * len, ty = y + ey * len;
      const g = fctx.createLinearGradient(x, y, tx, ty);
      g.addColorStop(0, 'rgba(' + col + ',' + (.2 * beamLevel * pulse).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + col + ',0)');
      fctx.fillStyle = g;
      fctx.beginPath(); fctx.moveTo(x, y); fctx.lineTo(tx + px, ty + py); fctx.lineTo(tx - px, ty - py); fctx.closePath(); fctx.fill();
    }
    fctx.globalCompositeOperation = 'source-over';
  }

  // ---------- Rooftop fountains ----------
  const fountains = [];
  function fountain(p, secs, col){ fountains.push({ p, until:time + secs, col }); }
  function runFountains(dt){
    for (let i = fountains.length - 1; i >= 0; i--){
      const f = fountains[i];
      if (time > f.until){ fountains.splice(i, 1); continue; }
      const [x, y] = px2(f.p), n = Math.ceil(dt * (reduce ? 40 : 130));
      const u = unit();
      for (let k = 0; k < n; k++){
        const a = (Math.random() - .5) * .42, s = (240 + Math.random() * 190) * u;
        spawn(x, y, Math.sin(a) * s, -Math.cos(a) * s, { drag:.9, grav:230 * u, life:.9 + Math.random() * .5, col:Math.random() < .3 ? '255,255,240' : f.col, w:1.2, dim:1 });
      }
    }
  }

  // ---------- The show ----------
  const nextT = -1;
  const shell = (type, xf, yf, o) => () => launchAt(xf * FW, yf * FH, false, { force:type, depth:.9, vol:.7, ...o });
  const say = (lines) => () => launchAt(FW / 2, FH * .17, false, { force:'text', text:lines, vol:.9, theme:nextT });
  function buildShow(){
    const ev = [], at = (t, fn) => ev.push({ t, fn }), B = BEAT, thin = reduce ? 2 : 1;
    const R = () => .08 + Math.random() * .84, Y = () => .08 + Math.random() * .28;
    const mix = ['chrysanthemum', 'dahlia', 'peony', 'palm', 'ring', 'crossette', 'glitter', 'saturn', 'pistil', 'fish', 'willow'];
    const pick = (a) => a[(Math.random() * a.length) | 0];
    const wide = FW > FH;
    const twoWords = () => (wide ? ['HAPPY DIWALI'] : ['HAPPY', 'DIWALI']);
    // 1. rooftops open up
    at(.7, () => beamRoofs.slice(0, 4).forEach((p) => fountain(p, 3.6, THEMES[theme].shells[0])));
    // 2. a sweep of shells, left to right, on the beat
    for (let i = 0; i < 8; i += thin) at(2.2 + i * B, shell(i % 2 ? 'peony' : 'chrysanthemum', .1 + .8 * i / 7, .3 - Math.sin(i / 7 * 3.14) * .12, { theme:i === 0 ? nextT : undefined }));
    // 3. the greeting, written in sparks
    at(7, say(twoWords()));
    // 4. shapes, in pairs
    const pairs = [['heart', 'star'], ['rangoli', 'diya'], ['spiral', 'saturn'], ['rangoli', 'heart'], ['star', 'diya']];
    pairs.forEach((p, i) => {
      at(11 + i * 2 * B * 1.5, shell(p[0], .25, .2, { theme:nextT, depth:1 }));
      at(11.5 + i * 2 * B * 1.5, shell(p[1], .75, .23, { depth:1 }));
    });
    // 5. a fan out of the tower, then gold crowns
    for (let i = 0; i < 7; i += thin) at(20 + i * .13, shell('kamuro', .5 + (i - 3) * .13, .2 + Math.abs(i - 3) * .03, { theme:i === 0 ? nextT : undefined }));
    // 6. the logo
    at(23.3, shell('bubble', .5, .2, { theme:nextT, depth:1, vol:1 }));
    // 7. a barrage
    for (let i = 0; i < 26; i += thin) at(24.6 + i * .22, shell(pick(mix), R(), Y(), { depth:.55 + Math.random() * .45, vol:.5, theme:i % 8 === 0 ? nextT : undefined }));
    at(26, () => beamRoofs.forEach((p) => fountain(p, 4, THEMES[theme].shells[1])));
    // 8. finale
    for (let i = 0; i < 42; i += thin) at(30.4 + i * .11, shell(i % 5 ? pick(mix) : 'kamuro', R(), Y(), { depth:.6 + Math.random() * .4, vol:.55, theme:i % 11 === 0 ? nextT : undefined }));
    at(35.4, say(wide ? ['FROM POCKET FM'] : ['FROM', 'POCKET FM']));
    at(37, shell('kamuro', .2, .2, { vol:.8 }));
    at(37.1, shell('kamuro', .8, .2, { vol:.8 }));
    at(38.2, finishShow);
    return ev.sort((a, b) => a.t - b.t);
  }
  let show = null, showT = 0, showIdx = 0, started = false, reveal = 0;
  function startShow(){
    sfx.unlock();
    started = true;
    state.litTarget = 1;
    sfx.setMood(true);
    sfx.chime();
    haptics.play([[0, 14], [84, 10], [144, 45]]);
    startBtn.classList.add('gone');
    startBtn.setAttribute('tabindex', '-1');
    signEl.classList.add('on');
    reveal = Math.max(reveal, .001);
    againBtn.classList.remove('on');
    hint.classList.add('on');
    show = buildShow(); showT = 0; showIdx = 0;
  }
  function finishShow(){ show = null; againBtn.classList.add('on'); }
  function runShow(dt){
    if (!show) return;
    showT += dt;
    while (show && showIdx < show.length && show[showIdx].t <= showT) show[showIdx++].fn();
  }
  // after the show the sky stays alive, more gently
  let nextShell = 2, sinceTheme = 0;
  function runAmbient(dt){
    if (show || !started || reduce) return;
    sinceTheme += dt; nextShell -= dt;
    if (nextShell > 0) return;
    const shift = sinceTheme > 9;
    if (shift) sinceTheme = 0;
    const types = BURST_TYPES;
    launchAt(FW * (.08 + Math.random() * .84), FH * (.1 + Math.random() * .36), false, { force:types[(Math.random() * types.length) | 0], depth:.5 + Math.random() * .5, vol:.35, theme:shift ? nextT : undefined });
    nextShell = 1 + Math.random() * 1.6;
  }

  // ---------- Interaction ----------
  startBtn.addEventListener('click', startShow);
  againBtn.addEventListener('click', startShow);
  soundBtn.addEventListener('click', () => {
    sfx.unlock();
    const m = !sfx.muted;
    sfx.setMuted(m);
    soundBtn.setAttribute('aria-pressed', m ? 'false' : 'true');
    soundBtn.setAttribute('aria-label', m ? 'Sound off' : 'Sound on');
  });
  // every tap is a firework, and the sky turns with it
  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    sfx.unlock();
    launchAt(e.clientX, e.clientY, true, { force:BURST_TYPES[(Math.random() * BURST_TYPES.length) | 0] });
  });
  let px = 0;
  window.addEventListener('pointermove', (e) => { px = e.clientX / FW - .5; });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F'){ sfx.unlock(); launchAt(FW * (.1 + Math.random() * .8), FH * (.1 + Math.random() * .3), true); }
  });

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now){
    const real = Math.min(.5, (now - last) / 1000); // the show keeps real time, so it stays with the music on slow phones
    const dt = Math.min(.05, real);
    last = now; time += dt;
    state.lit += (state.litTarget - state.lit) * (1 - Math.exp(-2.4 * dt));
    easeTheme(dt);
    beamLevel += ((show ? 1 : started ? .4 : 0) - beamLevel) * (1 - Math.exp(-2 * dt));

    // the lights come on in a wave from the tower outward
    if (reveal > 0 && reveal < 1){
      reveal = Math.min(1, reveal + dt / (reduce ? .6 : 2.4));
      litImg.style.setProperty('--r', (reveal * 135 - 16).toFixed(1) + '%');
      if (reveal >= 1) litImg.style.webkitMaskImage = litImg.style.maskImage = 'none';
    }

    // firework light on the rooftops, and a very slight shake and drift
    flashLevel *= Math.exp(-5.5 * dt);
    const op = Math.min(.5, flashLevel * .5).toFixed(3);
    if (op !== lastOp){ tintEl.style.opacity = op; lastOp = op; }
    shake *= Math.exp(-7 * dt);
    if (!reduce){
      const dx = Math.sin(time * .13) * 5 + px * -14 + (Math.random() - .5) * shake * 3;
      const dy = (Math.random() - .5) * shake * 3;
      city.style.transform = 'translate3d(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px,0)';
    }

    const skyOp = (.35 + state.lit * .65).toFixed(3);
    if (skyOp !== lastSkyOp){ skyEl.style.opacity = skyOp; lastSkyOp = skyOp; }

    runShow(real);
    runAmbient(dt);
    runFountains(dt);
    updateFx(dt);
    drawTrails(dt);
    fctx.clearRect(0, 0, FW, FH);
    drawSky(time, dt);
    drawFloaters(time, dt);
    drawBeams(time);
    drawFx(time);

    requestAnimationFrame(frame);
  }
  const skyEl = document.querySelector('.sky');
  let lastSkyOp = '', lastOp = '';
  requestAnimationFrame(frame);
  // show the city once both photos are ready, so it never pops in half-loaded
  Promise.all([...city.querySelectorAll('img')].map((i) => (i.decode ? i.decode().catch(() => {}) : null))).then(() => city.classList.add('ready'));
})();
</script>
</body>
</html>
