<style>
  :root{
    --sky-top:#24105e;
    --sky-mid:#140838;
    --sky-bottom:#060218;
    --ink:#f7f1ff;
    --ink-soft:rgba(247,241,255,.66);
    --pill:rgba(255,255,255,.08);
    --pill-hover:rgba(255,255,255,.16);
    --pill-border:rgba(214,190,255,.35);
    --focus:#d6beff;
    color-scheme: dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  /* The scene is a night sky in both modes, so dark values match light ones. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --sky-top:#24105e; --sky-mid:#140838; --sky-bottom:#060218; --ink:#f7f1ff; }
  }
  :root[data-theme="dark"]{ --sky-top:#24105e; --sky-mid:#140838; --sky-bottom:#060218; --ink:#f7f1ff; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  html,body{ height:100%; margin:0; overflow:hidden; overscroll-behavior:none; }
  body{
    /* unlit: a deep, near-black purple night */
    background:radial-gradient(140% 100% at 60% 40%, #10052b 0%, #08021a 55%, #030010 100%);
    background-color:#030010;
    color:var(--ink);
    font-family:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  /* fine grain: breaks up gradient banding and gives the sky a printed feel */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity:.07; mix-blend-mode:soft-light;
  }
  /* lit sky: fades in with the lantern's light (opacity driven from the render loop) */
  .sky{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0;
    background:
      radial-gradient(90% 60% at 50% 42%, rgba(70,24,150,.55) 0%, rgba(70,24,150,0) 70%),
      radial-gradient(140% 100% at 50% 40%, var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-bottom) 100%);
  }
  #fx, #scene{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #fx{ z-index:0; pointer-events:none; }
  #scene{ z-index:1; touch-action:none; cursor:grab; opacity:0; transition:opacity 1.6s ease .1s; }
  #scene.ready{ opacity:1; }
  #scene.dragging{ cursor:grabbing; }

  /* layout: copy column on the left, lantern on the right on wide screens */
  .copy{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 22px) max(22px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(22px, env(safe-area-inset-left,0px));
  }
  /* phones: everything stacks on the centre line */
  header{ text-align:center; padding:0 8px; }
  header .brand{ display:block; height:30px; width:auto; margin:0 auto 22px; }
  h1{
    margin:0;
    font-family:"Allura", "Snell Roundhand", "Apple Chancery", cursive;
    font-weight:400; font-size:clamp(40px, 11vw, 58px); line-height:.95; letter-spacing:.005em;
    text-wrap:balance;
    text-shadow:0 2px 28px rgba(150,80,255,.5);
  }
  header p{ margin:8px 0 0; color:var(--ink-soft); font-size:15px; letter-spacing:.01em; }
  footer{ display:flex; flex-direction:column; align-items:center; gap:12px; }
  #hint{ margin:0; color:var(--ink-soft); font-size:14px; letter-spacing:.01em; text-align:center; min-height:1.3em; transition:opacity .5s; }

  @media (min-aspect-ratio: 4/3) and (min-width: 700px){
    .copy{
      inset:auto; top:50%; left:max(clamp(32px, 7vw, 140px), env(safe-area-inset-left,0px));
      transform:translateY(-50%);
      width:min(44vw, 580px); padding:0;
      justify-content:flex-start; gap:clamp(22px, 6vh, 52px);
    }
    header{ padding:0; text-align:left; }
    header .brand{ height:clamp(30px, 2.5vw, 40px); margin:0 0 clamp(12px, 2.6vh, 26px); }
    footer{ align-items:flex-start; }
    #hint{ text-align:left; }
    h1{ font-size:min(clamp(60px, 6.2vw, 108px), 15vh); max-width:12ch; line-height:.92; }
    header p{ font-size:clamp(15px, 1.25vw, 19px); margin-top:clamp(10px, 2vh, 18px); }
    #hint{ font-size:clamp(14px, 1.05vw, 16px); }
  }
  .pill{
    pointer-events:auto;
    font:inherit; font-weight:500; font-size:15px; color:var(--ink);
    background:var(--pill); border:1px solid var(--pill-border);
    border-radius:999px; cursor:pointer; touch-action:manipulation; min-height:44px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:background .25s, border-color .25s, transform .15s;
  }
  .pill:hover{ background:var(--pill-hover); border-color:rgba(230,212,255,.55); }
  .pill:active{ transform:scale(.97); }
  .pill:focus-visible{ outline:2px solid var(--focus); outline-offset:3px; }
  #toggle{
    --face-top:#ffe6a8; --face-bot:#f2b24a; --lip:#a8661a; --ink-btn:#3b1600; --halo:rgba(255,190,90,.45);
    position:relative; min-height:54px; padding:0 30px 0 24px;
    display:inline-flex; align-items:center; gap:10px;
    font-weight:600; font-size:16px; letter-spacing:.005em; color:var(--ink-btn);
    border:0; border-radius:999px;
    background:linear-gradient(180deg, var(--face-top), var(--face-bot));
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.75),
      inset 0 -2px 6px rgba(0,0,0,.12),
      0 5px 0 var(--lip),
      0 12px 26px var(--halo);
    transform:translateY(0);
    transition:transform .09s ease, box-shadow .09s ease, filter .2s;
    backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  #toggle:hover{ filter:brightness(1.05); background:linear-gradient(180deg, var(--face-top), var(--face-bot)); }
  #toggle:active, #toggle.pressed{
    transform:translateY(4px);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.6),
      inset 0 2px 8px rgba(0,0,0,.14),
      0 1px 0 var(--lip),
      0 5px 14px var(--halo);
  }
  #toggle[aria-pressed="true"]{
    --face-top:#f6efff; --face-bot:#cdb2ff; --lip:#6f45c8; --ink-btn:#250a5e; --halo:rgba(170,120,255,.4);
  }
  #toggle .flame{ width:18px; height:18px; flex:none; }
  #toggle .flame path{ transition:fill .3s; }
  #toggle[aria-pressed="false"]::after{
    content:""; position:absolute; inset:-6px; border-radius:999px; pointer-events:none;
    box-shadow:0 0 0 0 rgba(255,205,120,.55);
    animation:invite 2.4s ease-out infinite;
  }
  @keyframes invite{ 0%{ box-shadow:0 0 0 0 rgba(255,205,120,.5); } 70%,100%{ box-shadow:0 0 0 14px rgba(255,205,120,0); } }
  @media (prefers-reduced-motion: reduce){ #toggle::after{ animation:none !important; } }

  #sound{
    position:fixed; z-index:3;
    top:calc(env(safe-area-inset-top,0px) + 16px); right:16px;
    width:44px; height:44px; padding:0; display:grid; place-items:center;
  }
  #sound svg{ width:19px; height:19px; }
  #sound .off{ display:none; }
  #sound[aria-pressed="false"] .on{ display:none; }
  #sound[aria-pressed="false"] .off{ display:block; }

  /* very short screens (phones held sideways) */
  @media (max-height: 460px){
    header p{ display:none; }
    #sound{ top:calc(env(safe-area-inset-top,0px) + 10px); }
  }
  @media (prefers-reduced-motion: no-preference){
    header{ animation:rise 1.4s cubic-bezier(.2,.7,.2,1) .3s both; }
    footer{ animation:rise 1.4s cubic-bezier(.2,.7,.2,1) .9s both; }
    @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  }
</style>
</head>

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('scene');
  const hint = document.getElementById('hint');
  const btn = document.getElementById('toggle');
  const btnLabel = btn.querySelector('.label');
  const soundBtn = document.getElementById('sound');
  const fx = document.getElementById('fx');
  const fctx = fx.getContext('2d');
  let FW = 1, FH = 1;
  function sizeFx(){
    const d = Math.min(window.devicePixelRatio || 1, 2);
    FW = window.innerWidth; FH = window.innerHeight;
    fx.width = Math.round(FW * d); fx.height = Math.round(FH * d);
    fctx.setTransform(d, 0, 0, d, 0, 0);
  }

  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  // lantern proportions: 6 sides, slim body
  const N = 6, STEP = 360 / N;
  const R = 1, H = 0.68, BH = 0.38;
  const RW = R / Math.cos(Math.PI / N); // keeps each diamond face flat
  const HOOK_Y = H + BH + 1.05;
  // fixed point the cord hangs from, far above the screen; the lantern swings from here
  const ANCHOR_Y = HOOK_Y + 7;
  const FACE_ASPECT = (2 * R * Math.tan(Math.PI / N)) / (2 * H); // panel width / height
  const FIT_TOP = HOOK_Y - .1, FIT_BOTTOM = -H - BH - 2.2, FIT_W = 2 * RW + .4;

  const headerEl = document.querySelector('header');
  const hintEl = document.getElementById('hint');
  const copyEl = document.querySelector('.copy');
  const wideMQ = matchMedia('(min-aspect-ratio: 4/3) and (min-width: 700px)');
  const region = { l:0, r:1, t:0, b:1 };
  function computeRegion(w, h){
    if (wideMQ.matches){
      const c = copyEl.getBoundingClientRect();
      region.l = Math.max(c.right + w * .02, w * .46); region.r = w * .97;
      region.t = h * .07; region.b = h * .95;
    } else {
      region.l = 0; region.r = w;
      region.t = Math.max(headerEl.getBoundingClientRect().bottom + 12, h * .1);
      region.b = Math.min(hintEl.getBoundingClientRect().top - 14, h * .94);
    }
  }
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    // pin both canvases to the visible viewport so tap maths matches what is drawn,
    // even while a mobile browser's toolbar slides in and out
    canvas.style.height = fx.style.height = h + 'px';
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // fit the lantern into its free region (below the copy on phones, right of it on wide screens)
    computeRegion(w, h);
    const availH = Math.min(Math.max(140, region.b - region.t), 620);
    const availW = Math.max(160, region.r - region.l);
    const tanH = Math.tan(17.5 * Math.PI / 180);
    const wide = wideMQ.matches;
    const zH = (FIT_TOP - FIT_BOTTOM) * h / (2 * tanH * availH * (wide ? .9 : .8));
    const zW = FIT_W * h / (2 * tanH * availW * (wide ? .7 : .62));
    const z = Math.max(8.5, zH, zW);
    const cy = (FIT_TOP + FIT_BOTTOM) / 2;
    camera.position.set(0, cy, z);
    camera.lookAt(0, cy, 0);
    const shiftX = (region.l + region.r) / 2 - w / 2;
    const shiftY = (region.t + region.b) / 2 - h / 2;
    camera.setViewOffset(w, h, -shiftX, -shiftY, w, h);
    camera.updateProjectionMatrix();
    sizeFx();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  setTimeout(resize, 1600); // after the header's entrance animation settles

  // ---------- Textures ----------
  const logoPath = new Path2D(LOGO_PATH);
  function drawLogo(ctx, cx, cy, w, color){
    const s = w / LOGO_VIEWBOX[2];
    ctx.save();
    ctx.translate(cx - w / 2, cy - LOGO_VIEWBOX[3] * s / 2);
    ctx.scale(s, s);
    ctx.translate(-LOGO_VIEWBOX[0], -LOGO_VIEWBOX[1]);
    ctx.fillStyle = color;
    ctx.fill(logoPath, 'evenodd');
    ctx.restore();
  }
  function tex(w, h, draw){
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = maxAniso;
    return t;
  }
  function diamondPath(ctx, cx, cy, r){
    ctx.beginPath();
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy);
    ctx.closePath();
  }
  function archPath(ctx, cx, top, w, h){
    const r = w / 2;
    ctx.beginPath();
    ctx.moveTo(cx - r, top + h); ctx.lineTo(cx - r, top + r);
    ctx.arc(cx, top + r, r, Math.PI, 0);
    ctx.lineTo(cx + r, top + h); ctx.closePath();
  }
  function sparkle(ctx, x, y, r){
    const k = r * .26;
    ctx.beginPath();
    ctx.moveTo(x, y - r); ctx.lineTo(x + k, y - k); ctx.lineTo(x + r, y); ctx.lineTo(x + k, y + k);
    ctx.lineTo(x, y + r); ctx.lineTo(x - k, y + k); ctx.lineTo(x - r, y); ctx.lineTo(x - k, y - k);
    ctx.closePath();
  }
  function dotDiamond(ctx, r, step, rad){
    const pts = [[256, 256 - r], [256 + r, 256], [256, 256 + r], [256 - r, 256]];
    for (let e = 0; e < 4; e++){
      const a = pts[e], b = pts[(e + 1) % 4];
      const n = Math.floor(Math.hypot(b[0] - a[0], b[1] - a[1]) / step);
      for (let i = 0; i < n; i++){
        const t = (i + .5) / n;
        ctx.beginPath(); ctx.arc(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, rad, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  function zigzag(ctx, w, y, dir, size, step){
    ctx.beginPath();
    for (let x = 0; x < w; x += step){
      ctx.moveTo(x, y); ctx.lineTo(x + step / 2, y + dir * size); ctx.lineTo(x + step, y);
    }
    ctx.closePath(); ctx.fill();
  }

  // Panels: gold frame with a dotted border and a big logo in the middle.
  // Nudged up and right so the bubble's tail clears the dotted border.
  const LOGO_DX = 6, LOGO_DY = -8;
  function panelDraw(glow){
    return (ctx) => {
      if (glow){ ctx.fillStyle = '#2e0f7c'; }
      else { const g = ctx.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#a565ff'); g.addColorStop(1, '#6b25e8'); ctx.fillStyle = g; }
      ctx.fillRect(0, 0, 512, 512);
      // soft light pooling behind the logo
      const rg = ctx.createRadialGradient(256, 256, 0, 256, 256, 230);
      rg.addColorStop(0, glow ? 'rgba(165,110,255,1)' : 'rgba(180,130,255,.55)');
      rg.addColorStop(1, glow ? 'rgba(46,15,124,0)' : 'rgba(180,130,255,0)');
      ctx.fillStyle = rg; diamondPath(ctx, 256, 256, 236); ctx.fill();
      diamondPath(ctx, 256, 256, 244); ctx.strokeStyle = glow ? '#8a5a1c' : '#ffd27a'; ctx.lineWidth = 6; ctx.stroke();

      if (glow){

        drawLogo(ctx, LOGO_DX, LOGO_DY, 196, '#e2d0ff');
        ctx.restore();
      }
      drawLogo(ctx, LOGO_DX, LOGO_DY, 180, '#ffffff');
      ctx.restore();
    };

    let f;
    if (state.flickerT > 0){ state.flickerT -= dt; f = Math.random() < .35 ? .2 : 1; }
    else f = reduce ? 1 : .93 + .07 * Math.sin(time * 11) * Math.sin(time * 6.7 + .4);
    const L = state.lit * f;
    matDiamond.emissiveIntensity = L;
    matTri.emissiveIntensity = L * .9;
    matBand.emissiveIntensity = L * .85;
    matBottom.emissiveIntensity = L * .9;
    matTassel.emissiveIntensity = L * .45;
    matGold.emissiveIntensity = L * .35;
    innerLight.intensity = L * 1.3;
    hemi.intensity = .05 + state.lit * .7;
    moon.intensity = .05 + state.lit * .5;
    glowAmt = L;
    stringMat.color.setScalar(.4 + state.lit * .6);
    const skyOp = state.lit.toFixed(3);
    if (skyOp !== lastSkyOp){ skyEl.style.opacity = skyOp; lastSkyOp = skyOp; }

    updateTassels(time);

    updateFx(dt);
    fctx.clearRect(0, 0, FW, FH);
    lanternScreen();
    drawSky(time, dt);
    drawGlow();
    drawRipples(dt);
    drawMotes(time, dt);
    drawFx(time);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  requestAnimationFrame(() => canvas.classList.add('ready'));
})();
</script>
